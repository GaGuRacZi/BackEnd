name: Deploy to Elastic Beanstalk

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: gaguraczi/paw
  EB_APPLICATION_NAME: paw
  EB_ENVIRONMENT_NAME: Paw-env

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: meta
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_URI=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ steps.meta.outputs.IMAGE_URI }}:${{ steps.meta.outputs.IMAGE_TAG }}
            ${{ steps.meta.outputs.IMAGE_URI }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Required GitHub Secrets:
      # - AWS_ROLE_ARN: IAM role for GitHub OIDC
      # - EB_ENV_FILE: full env text (SPRING_PROFILES_ACTIVE, AWS_DB_*, VALKEY_*, JWT_*, etc.)
      - name: Sync env to Elastic Beanstalk
        env:
          EB_ENV_FILE: ${{ secrets.EB_ENV_FILE }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          import re
          import subprocess

          raw = os.environ["EB_ENV_FILE"]
          env_name = os.environ["EB_ENVIRONMENT_NAME"]

          options = []
          for line in raw.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              if line.startswith("export "):
                  line = line[len("export ") :].strip()
              if "=" not in line:
                  continue

              key, value = line.split("=", 1)
              key = key.strip()
              value = value.strip().strip('"').strip("'")

              if not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*", key):
                  raise SystemExit(f"Invalid env key: {key}")

              options.append(
                  {
                      "Namespace": "aws:elasticbeanstalk:application:environment",
                      "OptionName": key,
                      "Value": value,
                  }
              )

          if not options:
              raise SystemExit("No environment variables found in EB_ENV_FILE")

          options_path = "eb-options.json"
          with open(options_path, "w", encoding="utf-8") as file:
              json.dump(options, file)

          print(f"Updating {len(options)} environment variables on {env_name}")
          subprocess.check_call(
              [
                  "aws",
                  "elasticbeanstalk",
                  "update-environment",
                  "--environment-name",
                  env_name,
                  "--option-settings",
                  f"file://{options_path}",
              ]
          )
          PY

      - name: Wait for environment update
        run: |
          aws elasticbeanstalk wait environment-updated \
            --environment-name "$EB_ENVIRONMENT_NAME"

      - name: Prepare Dockerrun.aws.json
        run: |
          set -euo pipefail
          sed -i "s/IMAGE_TAG/${{ steps.meta.outputs.IMAGE_TAG }}/g" Dockerrun.aws.json
          zip deploy.zip Dockerrun.aws.json

      - name: Deploy to Elastic Beanstalk
        run: |
          set -euo pipefail
          VERSION_LABEL="app-$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          BUCKET=$(aws elasticbeanstalk create-storage-location --query S3Bucket --output text)

          aws s3 cp deploy.zip "s3://${BUCKET}/${EB_APPLICATION_NAME}/${VERSION_LABEL}.zip"

          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APPLICATION_NAME" \
            --version-label "$VERSION_LABEL" \
            --source-bundle "S3Bucket=${BUCKET},S3Key=${EB_APPLICATION_NAME}/${VERSION_LABEL}.zip"

          aws elasticbeanstalk update-environment \
            --environment-name "$EB_ENVIRONMENT_NAME" \
            --version-label "$VERSION_LABEL"

          aws elasticbeanstalk wait environment-updated \
            --environment-name "$EB_ENVIRONMENT_NAME"
