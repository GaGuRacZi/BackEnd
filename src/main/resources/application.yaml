spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: local
    group:
      rag-ingest:
        - local
      medication-ingest:
        - local
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 110MB
  sql:
    init:
      # postgis/vector extensions are created at app startup via db/extensions.sql
      # (runs before Hibernate DDL; idempotent with IF NOT EXISTS)
      # ;; so PL/pgSQL DO $$ blocks are not split on inner semicolons
      mode: always
      separator: ";;"
      schema-locations: classpath:db/extensions.sql,classpath:db/backfill-user-role.sql,classpath:db/backfill-user-coin.sql
  jpa:
    defer-datasource-initialization: false
  jwt:
    secret: ${JWT_SECRET}
    access-exp-ms: ${JWT_EXPIRATION:3600000} # 1시간
    refresh-exp-ms: ${JWT_REFRESH_EXPIRATION:1209600000} # 14일
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        # empty OPENAI_CHAT_MODEL= would become model="" → OpenAI 400. Omit the key to use the default.
        model: ${OPENAI_CHAT_MODEL:gpt-5.6-luna}
      embedding:
        # Omit the key to use the default. A blank OPENAI_EMBEDDING_MODEL= is rejected at startup.
        model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

kakao:
  user-info-uri: https://kapi.kakao.com/v2/user/me

naver:
  maps:
    client-id: ${NAVER_MAP_CLIENT_ID:}
    client-secret: ${NAVER_MAP_CLIENT_SECRET:}

smtp:
  host: ${SMTP_HOST:smtp.gmail.com}
  port: ${SMTP_PORT:587}
  use-tls: ${SMTP_USE_TLS:true}
  use-ssl: ${SMTP_USE_SSL:false}
  skip-cert-verify: ${SMTP_SKIP_CERT_VERIFY:false}
  timeout-seconds: ${SMTP_TIMEOUT_SECONDS:20}
  username: ${SMTP_USERNAME:}
  password: ${SMTP_PASSWORD:}
  from-email: ${SMTP_FROM_EMAIL:}

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region: ${AWS_REGION}
    s3:
      bucket: ${AWS_BUCKET}
      cdn-url: ${AWS_CDN_URL:}
      path:
        location: user/
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    max-http-form-post-size: 110MB
    max-swallow-size: 110MB
    connection-timeout: 600s

#Swagger
springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method

# Firebase Admin SDK (FCM). Values come from .env locally or EB_ENV_FILE in deploy.
# See docs/fcm-secrets.md for service-account → FCM_* mapping.
fcm:
  type: ${FCM_TYPE}
  project-id: ${FCM_PROJECT_ID}
  private-key-id: ${FCM_PRIVATE_KEY_ID}
  private-key: ${FCM_PRIVATE_KEY}
  client-email: ${FCM_CLIENT_EMAIL}
  client-id: ${FCM_CLIENT_ID}
  auth-uri: ${FCM_AUTH_URI:https://accounts.google.com/o/oauth2/auth}
  token-uri: ${FCM_TOKEN_URI:https://oauth2.googleapis.com/token}
  auth-provider-x509-cert-url: ${FCM_AUTH_PROVIDER_X509_CERT_URL:https://www.googleapis.com/oauth2/v1/certs}
  client-x509-cert-url: ${FCM_CLIENT_X509_CERT_URL}
  universe-domain: ${FCM_UNIVERSE_DOMAIN:googleapis.com}

paw:
  swagger:
    prod-server-url: ${PAW_SWAGGER_PROD_SERVER_URL:https://issueissyu-ai.cloud}
  rag:
    corpus-path: ${RAG_CORPUS_PATH:rag/data/59.반려견 성장 및 질병 관련 말뭉치 데이터}
    chunk-size-chars: 1000
    chunk-overlap-chars: 150
    ingest-batch-size: 64
    embedding-dimensions: 1536
    search-top-k: 8
    vector-store-id: ${OPENAI_VECTOR_STORE_ID:}
    chat-model: ${OPENAI_CHAT_MODEL:gpt-5.6-luna}
    reasoning-effort: ${OPENAI_RAG_REASONING_EFFORT:none}
  medication:
    ingest-batch-size: 8
    embedding-dimensions: 1536
    search-top-k: 10
    chat-model: ${OPENAI_MEDICATION_CHAT_MODEL:${OPENAI_CHAT_MODEL:gpt-5.6-luna}}
    reasoning-effort: ${OPENAI_MEDICATION_REASONING_EFFORT:none}
  visit:
    stt-model: ${OPENAI_VISIT_STT_MODEL:gpt-4o-transcribe-diarize}
    chat-model: ${OPENAI_VISIT_CHAT_MODEL:${OPENAI_CHAT_MODEL:gpt-5.6-luna}}
    ai-summary-chat-model: ${OPENAI_VISIT_AI_SUMMARY_CHAT_MODEL:${OPENAI_VISIT_CHAT_MODEL:${OPENAI_CHAT_MODEL:gpt-5.6-luna}}}
    reasoning-effort: ${OPENAI_VISIT_REASONING_EFFORT:none}
    ai-summary-coin-cost: 1
    ai-summary-include-sources: ${VISIT_AI_SUMMARY_INCLUDE_SOURCES:true}
    max-audio-bytes: 104857600
    max-audio-duration-sec: 3600

---
# local profile
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${LOCAL_DB_URL}
    username: ${LOCAL_DB_USERNAME}
    password: ${LOCAL_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${LOCAL_REDIS_HOST}
      port: ${LOCAL_REDIS_PORT}
      password: ${LOCAL_REDIS_PASSWORD:}  # 비밀번호 없으면 빈 값
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        use_sql_comments: true
        default_batch_fetch_size: 1000
  devtools:
    restart:
      enabled: true
      poll-interval: 1s
      quiet-period: 400ms
    livereload:
      enabled: true
---

# develop profile
spring:
  config:
    activate:
      on-profile: develop
  datasource:
    url: ${AWS_DB_URL}
    username: ${AWS_DB_USERNAME}
    password: ${AWS_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${VALKEY_HOST}
      port: ${VALKEY_PORT}
      ssl:
        enabled: true
      timeout: 3s
      connect-timeout: 3s
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        use_sql_comments: true
        default_batch_fetch_size: 1000


---
# prod profile — swagger/docs disabled
spring:
  config:
    activate:
      on-profile: prod

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

---
# rag-ingest — local CLI only. Activate with rag-ingest (group includes local).
# Does not apply RAG DDL. Compose lifecycle is off so ingest does not wait for
# elasticsearch or stop already-running postgres/redis on exit.
spring:
  config:
    activate:
      on-profile: rag-ingest
  docker:
    compose:
      lifecycle-management: none
  devtools:
    restart:
      enabled: false

---
# medication-ingest — local CLI only. Activate with medication-ingest (group includes local).
spring:
  config:
    activate:
      on-profile: medication-ingest
  docker:
    compose:
      lifecycle-management: none
  devtools:
    restart:
      enabled: false
