spring:
  application:
    name: paw
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  ai:
    google:
      genai:
        api-key: ${GOOGLE_GENAI_API_KEY:}

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:local-dev-jwt-secret-key-must-be-at-least-32-chars}
  access-exp-ms: ${JWT_ACCESS_EXP_MS:3600000}
  refresh-exp-ms: ${JWT_REFRESH_EXP_MS:1209600000}

app:
  cookie:
    secure: false
    same-site: Lax

cloud:
  aws:
    region: ${AWS_REGION:ap-northeast-2}
    credentials:
      access-key: ${AWS_ACCESS_KEY:local-access-key}
      secret-key: ${AWS_SECRET_KEY:local-secret-key}
    s3:
      bucket: ${AWS_S3_BUCKET:local-bucket}
      cdn-url: ${AWS_S3_CDN_URL:http://localhost}
      path:
        location: ${AWS_S3_PATH:uploads}
