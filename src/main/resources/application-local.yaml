spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/paw
    username: paw
    password: paw
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  docker:
    compose:
      enabled: true

  ai:
    vectorstore:
      elasticsearch:
        uris: http://localhost:9200

logging:
  level:
    org.hibernate.SQL: debug
