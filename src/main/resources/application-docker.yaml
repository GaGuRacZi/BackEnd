spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/paw
    username: paw
    password: paw
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: redis
      port: 6379

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  docker:
    compose:
      enabled: false

  ai:
    vectorstore:
      elasticsearch:
        uris: http://elasticsearch:9200

app:
  cookie:
    secure: true
    same-site: None
